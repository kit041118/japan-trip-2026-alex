<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf7f2" />
  <meta name="description" content="日本之旅 2026 — 箱根・河口湖・東京行程指南" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="日本之旅" />
  <title>日本之旅｜2026.11.28–12.05</title>
  <link rel="stylesheet" href="styles.css?v=20261021h" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🇯🇵</div>
        <div>
          <h1>日本之旅</h1>
          <div class="subtitle">2026.11.28 – 12.05</div>
        </div>
      </div>
      <nav class="nav-tabs" aria-label="主要導覽">
        <button type="button" class="nav-tab" data-view="foliage">紅葉</button>
        <button type="button" class="nav-tab" data-view="lights">燈飾</button>
        <button type="button" class="nav-tab" data-view="beauty">美容</button>
        <button type="button" class="nav-tab" data-view="restaurants">餐廳</button>
        <button type="button" class="nav-tab" data-view="shopping">購物</button>
        <button type="button" class="nav-tab active" data-view="home">總覽</button>
        <button type="button" class="nav-tab" data-view="itinerary">行程</button>
        <button type="button" class="nav-tab" data-view="passes">周遊券</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section id="view-foliage" class="view" aria-label="紅葉"></section>
    <section id="view-lights" class="view" aria-label="東京燈飾"></section>
    <section id="view-beauty" class="view" aria-label="美容"></section>
    <section id="view-restaurants" class="view" aria-label="餐廳"></section>
    <section id="view-shopping" class="view" aria-label="購物"></section>
    <section id="view-home" class="view active" aria-label="行程總覽"></section>

    <section id="view-itinerary" class="view" aria-label="每日行程">
      <div class="itinerary-toolbar">
        <div class="day-scroller" id="day-scroller" role="tablist" aria-label="選擇日子"></div>
        <div class="search-row">
          <div class="search-box">
            <span aria-hidden="true">🔍</span>
            <input id="search-input" type="search" placeholder="搜尋景點、餐廳…" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="day-header" id="day-header"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section id="view-passes" class="view" aria-label="周遊券"></section>
  </main>

  <footer class="app-footer">
    離線可用 · 景點可開啟 Google 地圖 · 資料來自行程表
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="圖片預覽">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="關閉">×</button>
    <img id="lightbox-img" alt="放大預覽" />
  </div>

  <script src="app.js?v=20261021h"></script>
</body>
</html>
